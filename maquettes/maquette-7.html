<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QG · Maquette 7</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { background: linear-gradient(#6fbcf2 0%, #b8e2ff 55%, #eef8ff 100%); }
  #c { position: fixed; inset: 0; display: block; touch-action: none; }
  .panel { position: fixed; top: 16px; left: 16px; background: rgba(255,255,255,.9); backdrop-filter: blur(6px);
    border-radius: 14px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(30,60,90,.18); color: #1f2937; max-width: 250px; }
  .panel h1 { font-size: 15px; margin: 0 0 2px; }
  .panel p { font-size: 12px; margin: 0 0 10px; color: #4b5563; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 12px; font-size: 12px; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #334155;
    background: rgba(255,255,255,.8); padding: 6px 12px; border-radius: 999px; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #fps { position: fixed; bottom: 14px; right: 16px; font: 11px ui-monospace, monospace; color: #334155; background: rgba(255,255,255,.6); padding: 3px 7px; border-radius: 6px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h1>JILL KORP · maquette 7</h1>
  <p>Le Hall au centre, le Quartier Général du CEO juste au nord, une salle par pôle. Aucune fonctionnalité.</p>
  <div class="legend">
    <span><i style="background:#3b82f6"></i>Cabinet</span>
    <span><i style="background:#8b5cf6"></i>Radar</span>
    <span><i style="background:#22c55e"></i>Atelier</span>
    <span><i style="background:#f97316"></i>Forge</span>
    <span><i style="background:#ec4899"></i>Studio</span>
    <span><i style="background:#ef4444"></i>Montage</span>
    <span><i style="background:#facc15"></i>Phare</span>
  </div>
</div>
<div class="hint">Clic gauche : tourner · molette ou pincer : zoom · clic droit, ZQSD ou flèches : se déplacer</div>
<div id="fps"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============ Moteur ============ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;   // ombres un peu moins douces mais bien moins coûteuses à chaque pixel
renderer.shadowMap.autoUpdate = false;          // ombres recalculées seulement quand une façade change
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const VIEW = 46;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -500, 1000);
const target = new THREE.Vector3(1, -1.5, -1);
camera.position.copy(target).addScaledVector(new THREE.Vector3(1, 1.45, 1).normalize(), 200);
camera.lookAt(target);

const controls = new OrbitControls(camera, canvas);
controls.target.copy(target);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enableZoom = false;                     // zoom géré plus bas, progressif
controls.screenSpacePanning = false;             // le déplacement reste à plat, sur x et z
controls.panSpeed = 1.2;
controls.minPolarAngle = 0.3; controls.maxPolarAngle = 1.15;   // rotation libre tout autour
controls.update();

function resize() {
  const a = innerWidth / innerHeight;
  const vh = a >= 1.3 ? VIEW : VIEW * 1.3 / a;
  camera.left = -vh * a / 2; camera.right = vh * a / 2; camera.top = vh / 2; camera.bottom = -vh / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight(0xd6ecff, 0x9a7b55, 1.15));
const sun = new THREE.DirectionalLight(0xfff0d6, 2.5);
sun.position.set(26, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 160 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

/* ============ Outils ============ */
const rng = (seed) => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = rng(7);
const pick = (arr, r = R) => arr[Math.floor(r() * arr.length)];
const col = (h) => new THREE.Color(h);
const tint = (h, a) => '#' + col(h).lerp(col('#ffffff'), a).getHexString();
const shade = (h, a) => '#' + col(h).lerp(col('#000000'), a).getHexString();

const matCache = new Map();
function mat(color, o = {}) {
  const key = color + JSON.stringify(o);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0, flatShading: true, ...o }));
  return matCache.get(key);
}
function glow(color, o = {}) {
  const key = 'glow' + color + JSON.stringify(o);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshBasicMaterial({ color, toneMapped: false, ...o }));
  return matCache.get(key);
}
const glassMat = new THREE.MeshStandardMaterial({ color: '#d4f1ff', transparent: true, opacity: 0.26, roughness: 0.08, metalness: 0.1, depthWrite: false });
const M = (m) => typeof m === 'string' ? mat(m) : m;

const G = { box: new THREE.BoxGeometry(1, 1, 1), plane: new THREE.PlaneGeometry(1, 1) };
const geoCache = {};
const cylGeo = (rt, rb, seg) => geoCache[`c${rt}_${rb}_${seg}`] ||= new THREE.CylinderGeometry(rt, rb, 1, seg);
const icoGeo = (det) => geoCache['i' + det] ||= new THREE.IcosahedronGeometry(1, det);

function finish(mesh, p, shadow = true) { mesh.castShadow = shadow; mesh.receiveShadow = true; p.add(mesh); return mesh; }
function grp(p, x = 0, y = 0, z = 0, r = 0) { const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = r; p.add(g); return g; }
function box(p, w, h, d, x, y, z, m, shadow = true) {
  const mesh = new THREE.Mesh(G.box, M(m)); mesh.scale.set(w, h, d); mesh.position.set(x, y + h / 2, z);
  return finish(mesh, p, shadow && m !== glassMat);
}
function cyl(p, rt, rb, h, x, y, z, m, seg = 14) {
  const mesh = new THREE.Mesh(cylGeo(rt, rb, seg), M(m)); mesh.scale.y = h; mesh.position.set(x, y + h / 2, z);
  return finish(mesh, p, m !== glassMat);
}
function sph(p, r, x, y, z, m, det = 1) {
  const mesh = new THREE.Mesh(icoGeo(det), M(m)); mesh.scale.setScalar(r); mesh.position.set(x, y, z);
  return finish(mesh, p);
}
function plane(p, w, h, x, y, z, m, ry = 0) {
  const mesh = new THREE.Mesh(G.plane, M(m)); mesh.scale.set(w, h, 1); mesh.position.set(x, y, z); mesh.rotation.y = ry;
  p.add(mesh); return mesh;
}
function floorPlane(p, w, d, x, y, z, tex) {
  const m = new THREE.Mesh(G.plane, new THREE.MeshStandardMaterial({ map: tex, roughness: .8 }));
  m.scale.set(w, d, 1); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.receiveShadow = true; p.add(m); return m;
}

function canvasTex(w, h, draw, repeat = false) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function tileTex(c1, c2) {
  return canvasTex(128, 128, (g) => {
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
      g.fillStyle = (i + j) % 2 ? c1 : c2; g.fillRect(i * 64, j * 64, 64, 64);
      g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(i * 64 + 3, j * 64 + 3, 58, 4);
      g.strokeStyle = 'rgba(0,0,0,.10)'; g.lineWidth = 3; g.strokeRect(i * 64 + 1.5, j * 64 + 1.5, 61, 61);
    }
  }, true);
}
function woodTex(base) {
  const r = rng(base.length * 31 + base.charCodeAt(3));
  return canvasTex(256, 256, (g) => {
    for (let row = 0; row < 8; row++) {
      let x = -r() * 120;
      while (x < 256) {
        const len = 90 + r() * 90;
        g.fillStyle = tint(shade(base, r() * 0.12), r() * 0.12); g.fillRect(x, row * 32, len, 32);
        g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(x, row * 32, 2, 32);
        for (let k = 0; k < 3; k++) { g.fillStyle = 'rgba(0,0,0,.05)'; g.fillRect(x, row * 32 + 6 + r() * 20, len, 1.5); }
        x += len;
      }
      g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(0, row * 32 + 30, 256, 2);
    }
  }, true);
}
function carpetTex(base, dots) {
  const r = rng(base.length * 17 + base.charCodeAt(2));
  return canvasTex(128, 128, (g) => {
    g.fillStyle = base; g.fillRect(0, 0, 128, 128);
    for (let i = 0; i < 500; i++) { g.fillStyle = `rgba(${r() < .5 ? '255,255,255' : '0,0,0'},.06)`; g.fillRect(r() * 128, r() * 128, 2, 2); }
    if (dots) for (let i = 0; i < 14; i++) { g.fillStyle = pick(dots, r); g.beginPath(); g.arc(r() * 128, r() * 128, 2.5, 0, 7); g.fill(); }
  }, true);
}
function floorTex(f, w, d) {
  let t;
  if (f.type === 'wood') { t = woodTex(f.c); t.repeat.set(w / 3, d / 3); }
  else if (f.type === 'carpet') { t = carpetTex(f.c, f.dots); t.repeat.set(w / 3, d / 3); }
  else { t = tileTex(f.c1, f.c2); t.repeat.set(w / 2, d / 2); }
  return t;
}

/* ---- textures d'écran ---- */
function screenTex(kind) {
  return canvasTex(256, 160, (g, w, h) => {
    const r = rng([...kind].reduce((a, c) => a * 31 + c.charCodeAt(0), 7));
    const bars = (x, y, n, colors, maxH, bw = 16, gap = 8) => { for (let i = 0; i < n; i++) { const bh = 12 + r() * maxH; g.fillStyle = colors[i % colors.length]; g.fillRect(x + i * (bw + gap), y - bh, bw, bh); } };
    const lines = (x, y, n, color, maxW, step = 12, hgt = 5) => { g.fillStyle = color; for (let i = 0; i < n; i++) g.fillRect(x, y + i * step, maxW * (0.4 + r() * 0.6), hgt); };
    switch (kind) {
      case 'code': case 'term': {
        g.fillStyle = kind === 'code' ? '#0f172a' : '#020a05'; g.fillRect(0, 0, w, h);
        const cs = kind === 'code' ? ['#60a5fa', '#f472b6', '#34d399', '#fbbf24', '#a78bfa', '#e2e8f0'] : ['#4ade80', '#22c55e', '#86efac'];
        for (let i = 0; i < 12; i++) { let x = 12 + Math.floor(r() * 3) * 14; for (let j = 0; j < 3 && x < w - 30; j++) { const ww = 18 + r() * 55; g.fillStyle = pick(cs, r); g.fillRect(x, 10 + i * 12, ww, 6); x += ww + 8; } }
        break; }
      case 'mail': {
        g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = '#dbeafe'; g.fillRect(0, 0, 54, h);
        g.fillStyle = '#3b82f6'; g.fillRect(8, 10, 38, 12);
        for (let i = 0; i < 9; i++) { g.fillStyle = i % 3 === 0 ? '#3b82f6' : '#cbd5e1'; g.beginPath(); g.arc(66, 16 + i * 16, 3, 0, 7); g.fill(); g.fillStyle = i % 3 === 0 ? '#1e293b' : '#64748b'; g.fillRect(76, 12 + i * 16, 50 + r() * 40, 6); g.fillStyle = '#cbd5e1'; g.fillRect(150, 12 + i * 16, 60 + r() * 30, 6); }
        break; }
      case 'calendar': {
        g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = '#3b82f6'; g.fillRect(0, 0, w, 22);
        g.fillStyle = '#fff'; g.font = 'bold 14px sans-serif'; g.fillText('Agenda · semaine', 10, 16);
        g.strokeStyle = '#e2e8f0'; for (let i = 0; i <= 7; i++) { g.beginPath(); g.moveTo(i * w / 7, 22); g.lineTo(i * w / 7, h); g.stroke(); }
        for (let i = 0; i < 12; i++) { const d = Math.floor(r() * 7); g.fillStyle = pick(['#93c5fd', '#fca5a5', '#86efac', '#fde68a', '#c4b5fd'], r); g.fillRect(d * w / 7 + 3, 28 + r() * 110, w / 7 - 6, 12 + r() * 18); }
        break; }
      case 'sheet': {
        g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = '#16a34a'; g.fillRect(0, 0, w, 16);
        g.strokeStyle = '#d1d5db'; for (let i = 0; i < 12; i++) { g.beginPath(); g.moveTo(0, 16 + i * 12); g.lineTo(w, 16 + i * 12); g.stroke(); }
        for (let i = 0; i < 7; i++) { g.beginPath(); g.moveTo(i * 38, 16); g.lineTo(i * 38, h); g.stroke(); }
        for (let i = 0; i < 26; i++) { g.fillStyle = pick(['#bbf7d0', '#fecaca', '#e5e7eb', '#fde68a'], r); g.fillRect(Math.floor(r() * 7) * 38 + 3, 19 + Math.floor(r() * 11) * 12, 30, 7); }
        break; }
      case 'chart': {
        g.fillStyle = '#1e1b4b'; g.fillRect(0, 0, w, h); bars(16, 140, 9, ['#a78bfa', '#818cf8', '#f472b6'], 100, 18, 8);
        g.strokeStyle = '#facc15'; g.lineWidth = 3; g.beginPath(); for (let i = 0; i < 9; i++) g.lineTo(25 + i * 26, 90 - i * 7 + r() * 20); g.stroke();
        break; }
      case 'seo': {
        g.fillStyle = '#fffbeb'; g.fillRect(0, 0, w, h); g.fillStyle = '#facc15'; g.fillRect(0, 0, w, 18);
        g.fillStyle = 'rgba(22,163,74,.15)'; g.fillRect(14, 60, 230, 90);
        g.strokeStyle = '#16a34a'; g.lineWidth = 4; g.beginPath(); for (let i = 0; i < 10; i++) g.lineTo(14 + i * 25, 140 - i * 10 - r() * 18); g.stroke();
        break; }
      case 'radar': {
        g.fillStyle = '#05140f'; g.fillRect(0, 0, w, h); g.strokeStyle = '#22c55e'; g.lineWidth = 1.5;
        for (let i = 1; i < 5; i++) { g.beginPath(); g.arc(w / 2, h / 2, i * 18, 0, 7); g.stroke(); }
        g.fillStyle = 'rgba(74,222,128,.35)'; g.beginPath(); g.moveTo(w / 2, h / 2); g.arc(w / 2, h / 2, 72, -0.2, 0.7); g.fill();
        for (let i = 0; i < 6; i++) { g.fillStyle = pick(['#f472b6', '#facc15', '#a78bfa'], r); g.beginPath(); g.arc(w / 2 + (r() - .5) * 120, h / 2 + (r() - .5) * 120, 4, 0, 7); g.fill(); }
        break; }
      case 'web': {
        g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = '#e5e7eb'; g.fillRect(0, 0, w, 16);
        g.fillStyle = pick(['#c4b5fd', '#fbcfe8', '#a5f3fc', '#fde68a'], r); g.fillRect(12, 24, w - 24, 50);
        for (let i = 0; i < 3; i++) { g.fillStyle = '#f1f5f9'; g.fillRect(12 + i * 80, 84, 70, 60); g.fillStyle = '#94a3b8'; g.fillRect(18 + i * 80, 90, 40, 6); }
        break; }
      case 'design': case 'brand': {
        g.fillStyle = '#f1f5f9'; g.fillRect(0, 0, w, h); g.fillStyle = '#1f2937'; g.fillRect(0, 0, 20, h);
        for (let i = 0; i < 3; i++) { g.fillStyle = '#fff'; g.fillRect(32 + i * 74, 20, 64, 120); g.fillStyle = pick(['#f472b6', '#a78bfa', '#fb923c', '#38bdf8'], r);
          if (kind === 'design') { g.fillRect(38 + i * 74, 28, 52, 30); lines(38 + i * 74, 66, 5, '#cbd5e1', 50); }
          else { g.beginPath(); g.arc(64 + i * 74, 60, 18, 0, 7); g.fill(); g.fillRect(44 + i * 74, 96, 40, 8); } }
        break; }
      case 'blender': {
        g.fillStyle = '#2b2b2b'; g.fillRect(0, 0, w, h); g.fillStyle = '#3d3d3d'; g.fillRect(0, 0, w, 14); g.fillRect(w - 50, 14, 50, h);
        g.strokeStyle = '#4a4a4a'; for (let i = 0; i < 12; i++) { g.beginPath(); g.moveTo(i * 20, 14); g.lineTo(i * 20, h); g.stroke(); }
        g.strokeStyle = '#f97316'; g.lineWidth = 3; g.strokeRect(70, 50, 60, 60); g.beginPath(); g.moveTo(70, 50); g.lineTo(95, 32); g.lineTo(155, 32); g.lineTo(130, 50); g.moveTo(155, 32); g.lineTo(155, 92); g.lineTo(130, 110); g.stroke();
        break; }
      case 'video': case 'wave': {
        g.fillStyle = '#111827'; g.fillRect(0, 0, w, h);
        if (kind === 'video') { const gr = g.createLinearGradient(0, 0, 0, 80); gr.addColorStop(0, '#fb7185'); gr.addColorStop(1, '#fbbf24'); g.fillStyle = gr; g.fillRect(60, 8, 136, 76); }
        else { g.strokeStyle = '#4ade80'; g.lineWidth = 2; g.beginPath(); for (let i = 0; i < 240; i += 3) { const a = Math.sin(i * .2) * 20 * r(); g.moveTo(8 + i, 45 - a); g.lineTo(8 + i, 45 + a); } g.stroke(); }
        for (let t = 0; t < 4; t++) { let x = 8; while (x < w - 20) { const ww = 14 + r() * 40; g.fillStyle = ['#ef4444', '#3b82f6', '#22c55e', '#a855f7'][t]; g.fillRect(x, 96 + t * 15, ww, 11); x += ww + 3 + r() * 10; } }
        break; }
      case 'thumbs': case 'social': {
        g.fillStyle = kind === 'thumbs' ? '#111827' : '#fff'; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) { g.fillStyle = pick(['#f43f5e', '#f59e0b', '#06b6d4', '#8b5cf6', '#10b981', '#ec4899'], r); g.fillRect(10 + i * 82, 10 + j * 74, 74, 66); g.fillStyle = 'rgba(255,255,255,.8)'; g.fillRect(16 + i * 82, 56 + j * 74, 40, 8); }
        break; }
      case 'notion': case 'slides': {
        g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = '#111827'; g.fillRect(16, 14, 110, 12);
        if (kind === 'slides') bars(30, 140, 6, ['#3b82f6', '#22c55e', '#f97316'], 70, 22, 14);
        else { for (let i = 0; i < 7; i++) { g.strokeStyle = '#9ca3af'; g.strokeRect(16, 38 + i * 16, 8, 8); lines(30, 39 + i * 16, 1, '#6b7280', 180); } }
        break; }
      case 'deploy': {
        g.fillStyle = '#0b1220'; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 8; i++) { g.fillStyle = i === 5 ? '#f59e0b' : '#22c55e'; g.beginPath(); g.arc(20, 16 + i * 18, 5, 0, 7); g.fill(); lines(34, 13 + i * 18, 1, '#cbd5e1', 160, 18, 6); }
        break; }
      case 'film': {
        const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#f97316'); gr.addColorStop(.55, '#fcd34d'); gr.addColorStop(.56, '#1e3a8a'); gr.addColorStop(1, '#0f172a');
        g.fillStyle = gr; g.fillRect(0, 0, w, h); g.fillStyle = '#fff7d6'; g.beginPath(); g.arc(160, 88, 22, Math.PI, 0); g.fill();
        g.fillStyle = '#7c2d12'; g.beginPath(); g.moveTo(0, 90); g.lineTo(60, 50); g.lineTo(110, 88); g.lineTo(0, 90); g.fill();
        g.fillStyle = '#000'; g.fillRect(0, 0, w, 12); g.fillRect(0, h - 12, w, 12);
        break; }
      case 'menu': {
        g.fillStyle = '#1f2a24'; g.fillRect(0, 0, w, h); g.fillStyle = '#f5f5f4'; g.font = 'bold 20px sans-serif'; g.fillText('CAFÉ', 96, 26);
        for (let i = 0; i < 6; i++) { lines(20, 42 + i * 18, 1, '#e7e5e4', 140, 18, 4); g.fillStyle = '#fde68a'; g.fillRect(210, 42 + i * 18, 26, 4); }
        break; }
      default: { // arcade
        g.fillStyle = '#0b0420'; g.fillRect(0, 0, w, h);
        const cs = ['#f43f5e', '#22d3ee', '#a3e635', '#facc15', '#e879f9'];
        for (let i = 0; i < 6; i++) for (let j = 0; j < 3; j++) { g.fillStyle = cs[(i + j + kind.length) % cs.length]; g.fillRect(30 + i * 34, 20 + j * 24, 18, 12); }
        g.fillStyle = '#22d3ee'; g.fillRect(118, 135, 22, 10);
      }
    }
  });
}
const scrCache = {};
const screenMat = (kind) => scrCache[kind] ||= new THREE.MeshBasicMaterial({ map: screenTex(kind), toneMapped: false });

/* ---- étiquettes des lieux : toujours lisibles, quelle que soit la fenêtre ----
   Avant, leur taille suivait celle de la scène : dans un petit volet (MCP), tout était réduit,
   étiquettes comprises. Maintenant leur hauteur à l'écran reste entre LABEL_MIN et LABEL_MAX pixels :
   plus grandes dans un petit volet, sans devenir énormes quand on zoome.                         */
const labels = [];
const LABEL_MIN = 20, LABEL_MAX = 28;
let labelKey = '';
function sizeLabels() {
  const key = camera.zoom + '_' + innerHeight + '_' + camera.top;
  if (key === labelKey) return;

const islet = grp(scene, ISLET.x, ISLET.y, ISLET.z);
floatingRock(islet, (th) => 4.4 * (1 + .07 * Math.sin(5 * th + 1) + .04 * Math.sin(9 * th)), .5, 5.5, 48, [], 3, [.3, .2]);
for (const [sx, sz, s] of [[-3.2, 2.6, .7], [2.8, -3.0, .55], [3.4, 2.2, .45]]) { const b = sph(islet, s, sx, .15, sz, '#9ca3af', 0); b.scale.y = .7; }
room({
  parent: islet, x: 0, y: .05, z: 0, w: 5, d: 5, accent: '#475569', label: 'Le Coffre', labelY: 3.4,
  sides: { n: 'mid', w: 'mid', s: 'mid', e: 'mid' }, doors: [{ side: 'w', off: 0, w: 1.3 }],
  floor: { type: 'tile', c1: '#475569', c2: '#526075' }, wain: '#64748b', cap: '#eab308',
  fill(g) {
    const vb = grp(g, .4, 0, -1.9); box(vb, 2.2, 2.3, .5, 0, 0, 0, '#6b7280');
    const vd = grp(vb, 0, 1.2, .3);
    const door = cyl(vd, .85, .85, .25, 0, 0, 0, mat('#9ca3af', { metalness: .7, roughness: .3 }), 24); door.rotation.x = Math.PI / 2; door.position.y = 0;
    const wheel = grp(vd, 0, 0, .18); for (let i = 0; i < 3; i++) { const sp = box(wheel, .8, .06, .06, 0, -.03, 0, '#eab308'); sp.rotation.z = i * Math.PI / 3; }
    spin(wheel, 'z', .25);
    const dep = grp(g, 1.9, 0, .5, -Math.PI / 2); box(dep, 1.6, 1.3, .4, 0, 0, 0, '#9ca3af');
    for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) box(dep, .32, .3, .02, -.54 + i * .36, .18 + j * .36, .21, '#d4d4d8', false);
    const pd = grp(g, -.3, 0, .6); box(pd, .45, .9, .45, 0, 0, 0, '#1f2937');
    const key = grp(pd, 0, 1.3, 0); key.add(new THREE.Mesh(new THREE.TorusGeometry(.12, .035, 6, 14), glow('#facc15'))); box(key, .05, .32, .04, 0, -.42, 0, glow('#facc15')); box(key, .12, .05, .04, .06, -.52, 0, glow('#facc15'));
    spin(key, 'y', 1);
    for (let i = 0; i < 3; i++) box(g, .5, .12, .25, 1.2, i * .12, 1.9, mat('#eab308', { metalness: .6, roughness: .3 }));
  },
});
const beacon = sph(islet, .16, 2.3, 1.85, 2.3, new THREE.MeshBasicMaterial({ color: '#ef4444', toneMapped: false }));
animate(beacon, (t) => beacon.material.color.setHSL(0, 1, Math.sin(t * 4) > 0 ? .5 : .18));
(function bridge() {
  const x0 = BX + .1, x1 = ISLET.x - 2.45, y0 = Y0, y1 = ISLET.y + .05, zc = ISLET.z;
  const len = Math.hypot(x1 - x0, y1 - y0);
  const br = grp(world, (x0 + x1) / 2, (y0 + y1) / 2, zc); br.rotation.z = Math.atan2(y1 - y0, x1 - x0);
  for (let i = 0, x = -len / 2; x < len / 2 - .1; x += .42, i++) box(br, .36, .09, 1.5, x + .18, -.09, 0, i % 2 ? '#a87645' : '#b98552');
  for (const s of [-1, 1]) {
    box(br, len, .05, .05, 0, .8, s * .75, '#7a4f2e');
    for (let x = -len / 2; x <= len / 2 + .01; x += len / 7) box(br, .07, .85, .07, x, -.05, s * .75, '#7a4f2e');
  }
  // barrière : aucun agent n'entre sans validation
  const gate = grp(world, BX + .55, Y0, zc);
  for (const s of [-1, 1]) box(gate, .12, 1.2, .12, 0, 0, s * .85, '#eab308');
  box(gate, .07, .12, 1.6, 0, .85, 0, glow('#ef4444'));
})();

/* ============ Bordure de l'île : sapins, deux sortes de grosses pierres, buissons, fleurs ============ */
(function () {
  const r = rng(99);
  const inside = (x, z, m) => Math.abs(x) < BX + m && Math.abs(z) < BZ + m;
  const onBridge = (x, z) => x > BX && Math.abs(z - ISLET.z) < 1.4;
  const blocked = (x, z) => onBridge(x, z) || (x > BX && Math.abs(z - 4.75) < 1.5);   // pont et entrée est
  const fits = (x, z, rad) => Math.hypot(x, z) + rad < edgeR(Math.atan2(z, x)) - .1;
  // sapin : tronc + trois étages de cônes
  const fir = (x, z, s) => {
    const g = grp(world, x, 0, z, r() * 6), c = pick(['#1f6b3a', '#235f36', '#2e7d32'], r);
    cyl(g, .09 * s, .13 * s, .45 * s, 0, 0, 0, '#6b4226', 6);
    cyl(g, 0, .75 * s, .9 * s, 0, .35 * s, 0, c, 8);
    cyl(g, 0, .58 * s, .8 * s, 0, .8 * s, 0, tint(c, .06), 8);
    cyl(g, 0, .4 * s, .7 * s, 0, 1.25 * s, 0, tint(c, .12), 8);
  };
  // pierre 1 : gros rocher gris arrondi, avec un ou deux petits à côté
  const boulder = (x, z, s) => {
    const g = grp(world, x, 0, z, r() * 6), c = pick(['#9ca3af', '#8b8f96', '#a8a29e'], r);
    const a = sph(g, .55 * s, 0, .2 * s, 0, c, 1); a.scale.set(.62 * s, .48 * s, .55 * s);
    const b = sph(g, .3 * s, .45 * s, .1 * s, .2 * s, shade(c, .08), 1); b.scale.set(.32 * s, .25 * s, .3 * s);
    if (r() < .6) { const d = sph(g, .2, -.42 * s, .06, -.2 * s, tint(c, .08), 0); d.scale.y = .6; }
  };
  // pierre 2 : roche plate en grès, empilée en strates
  const slab = (x, z, s) => {
    const g = grp(world, x, 0, z, r() * 6), c = pick(['#c9a77c', '#bf9b6f', '#d4b48c'], r);
    box(g, .95 * s, .32 * s, .7 * s, 0, 0, 0, c);
    const t = box(g, .7 * s, .28 * s, .52 * s, .08 * s, .32 * s, -.05 * s, tint(c, .08)); t.rotation.y = .3;
    if (r() < .5) box(g, .4 * s, .22 * s, .3 * s, -.05 * s, .6 * s, .02 * s, shade(c, .06)).rotation.y = -.4;
  };
  // ceinture d'objets tout autour du bureau, à mi-chemin entre la façade et le bord
  const pts = [];
  const ox = BX + 1.15, oz = BZ + 1.12;
  for (let x = -BX + .6; x <= BX - .6; x += 2.3) { pts.push([x, -oz]); pts.push([x, oz]); }
  for (let z = -BZ + .6; z <= BZ - .6; z += 2.3) { pts.push([-ox, z]); pts.push([ox, z]); }
  for (const [cx, cz] of [[ox, oz], [-ox, oz], [ox, -oz], [-ox, -oz]]) pts.push([cx - Math.sign(cx) * .3, cz - Math.sign(cz) * .3]);
  pts.forEach(([px, pz], i) => {
    const x = px + (r() - .5) * .5, z = pz + (r() - .5) * .4;
    if (blocked(x, z)) return;
    const u = (i * 7 + Math.floor(r() * 3)) % 6;
    if (u < 3) { const s = .85 + r() * .45; if (fits(x, z, .6 * s)) fir(x, z, s); }
    else if (u < 5) { const s = .9 + r() * .5; if (fits(x, z, .5 * s)) (u === 3 ? boulder : slab)(x, z, s); }
  });
  for (let n = 0, b = 0; n < 4000 && b < 90; n++) {
    const th = r() * Math.PI * 2, e = edgeR(th) * (.86 + r() * .12), x = e * Math.cos(th), z = e * Math.sin(th);
    if (inside(x, z, .45) || onBridge(x, z) || Math.hypot(x, z) > edgeR(th) - .35) continue;
    if (r() < .55) { const bs = sph(world, .22 + r() * .2, x, .1, z, pick(['#4caf50', '#689f38', '#43a047', '#2e7d32'], r)); bs.scale.y = .8; }
    else { const c = pick(['#f472b6', '#facc15', '#ffffff', '#a78bfa', '#fb7185'], r); for (let k = 0; k < 3; k++) sph(world, .07, x + (r() - .5) * .4, .08, z + (r() - .5) * .4, c, 0).castShadow = false; }
    b++;
  }
})();

/* ============ Nuages sous l'île (ils dérivent, l'île reste immobile) ============ */
const clouds = grp(scene);
(function () {
  const r = rng(321), cm = mat('#ffffff', { roughness: 1 });
  const cloud = (x, y, z, s) => { const g = grp(clouds, x, y, z); for (let i = 0; i < 6; i++) { const m = new THREE.Mesh(icoGeo(1), cm); m.scale.setScalar(s * (.6 + r() * .6)); m.position.set((i - 2.5) * s * .8, r() * s * .4, (r() - .5) * s); g.add(m); } };
  for (let i = 0; i < 18; i++) { const a = r() * Math.PI * 2, d = 28 + r() * 32; cloud(Math.cos(a) * d, -6 - r() * 10, Math.sin(a) * d, 1.8 + r() * 2.2); }
})();
animate(clouds, (t, dt) => { clouds.rotation.y += dt * .012; clouds.position.y = Math.sin(t * .4) * .6; });

/* ============ Optimisation : fusion de tous les objets fixes ============
   1. Des milliers de petits objets deviennent quelques dizaines de maillages.
   2. Les matériaux « physiques » (Standard) deviennent des matériaux Lambert, bien plus légers
      à calculer pour chaque pixel : c'est ce qui compte quand on zoome et que le bureau remplit l'écran. */
const lambertCache = new Map();
function toLambert(m) {
  if (!m.isMeshStandardMaterial) return m;
  if (!lambertCache.has(m.uuid)) lambertCache.set(m.uuid, new THREE.MeshLambertMaterial({
    color: m.color, map: m.map, emissive: m.emissive, emissiveIntensity: m.emissiveIntensity, vertexColors: m.vertexColors,
    transparent: m.transparent, opacity: m.opacity, depthWrite: m.depthWrite, side: m.side, flatShading: m.flatShading,
  }));
  return lambertCache.get(m.uuid);
}
function bake(root, dest, keepResult = false) {
  root.updateMatrixWorld(true);
  const buckets = new Map(), done = [], shared = bake.shared ||= new Map();
  root.traverse((o) => {
    if (!o.isMesh || o.userData.keep || Array.isArray(o.material)) return;
    const m = o.material;
    let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    g.applyMatrix4(o.matrixWorld);
    // matériaux unis regroupés : leur couleur passe dans les sommets
    const plainStd = m.isMeshStandardMaterial && !m.map && !m.transparent && !m.vertexColors && m.side === THREE.FrontSide && m.emissive.getHex() === 0;
    const plainBasic = m.isMeshBasicMaterial && !m.map && !m.transparent && !m.wireframe;
    let key, useMat = m;
    if (plainStd || plainBasic) {
      const mk = plainStd ? `S${m.roughness}_${m.metalness}_${m.flatShading}` : 'B';
      key = mk + (o.castShadow ? 's' : 'n');
      if (!shared.has(mk)) shared.set(mk, plainStd
        ? new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: m.flatShading })
        : new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false }));
      useMat = shared.get(mk);
      const n = g.attributes.position.count, c = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) { c[i * 3] = m.color.r; c[i * 3 + 1] = m.color.g; c[i * 3 + 2] = m.color.b; }
      g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
    } else { useMat = toLambert(m); key = useMat.uuid + (o.castShadow ? 's' : 'n'); }
    const keepColor = useMat.vertexColors;
    for (const name of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(name) && !(keepColor && name === 'color')) g.deleteAttribute(name);
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
    if (!g.attributes.normal) g.computeVertexNormals();
    g.clearGroups();
    if (!buckets.has(key)) buckets.set(key, { m: useMat, cast: o.castShadow, list: [] });
    buckets.get(key).list.push(g);
    done.push(o);
  });
  for (const o of done) o.parent.remove(o);
  let n = 0;
  for (const { m, cast, list } of buckets.values()) {
    const mesh = new THREE.Mesh(mergeGeometries(list, false), m);
    mesh.castShadow = cast && !m.transparent; mesh.receiveShadow = true; mesh.matrixAutoUpdate = false;
    if (keepResult) mesh.userData.keep = true;
    dest.add(mesh); n++;
  }
  return { before: done.length, after: n };
}
let total = 0, meshes = 0;
for (const k in facade) for (const part of ['tall', 'low']) { const s = bake(facade[k][part], facade[k][part], true); total += s.before; meshes += s.after; }
const st = bake(scene, scene); total += st.before; meshes += st.after;
// ce qui n'a pas été fusionné (dessus de l'île, objets animés) passe aussi en Lambert
scene.traverse((o) => { if (o.isMesh) o.material = Array.isArray(o.material) ? o.material.map(toLambert) : toLambert(o.material); });
console.log(`Fusion : ${total} objets → ${meshes} maillages`);

/* ============ Façades : celles du côté de la caméra s'abaissent ============ */
const camFlat = new THREE.Vector3(); let facadeKey = '';
function updateFacades() {
  camFlat.subVectors(camera.position, controls.target); camFlat.y = 0; camFlat.normalize();
  let key = '';
  for (const k in facade) {
    const f = facade[k], near = f.nx * camFlat.x + f.nz * camFlat.z > 0.2;
    f.tall.visible = !near; f.low.visible = near; key += near ? 1 : 0;
  }
  if (key !== facadeKey) { facadeKey = key; renderer.shadowMap.needsUpdate = true; }
}

/* ============ Zoom progressif (molette, pavé tactile, pincement) ============
   Le zoom dépend de la quantité de défilement, pas du nombre d'événements :
   il reste régulier avec une souris, un pavé tactile ou un écran tactile.         */
const ZMIN = 0.65, ZMAX = 7;
let zoomGoal = camera.zoom;
const cursor = new THREE.Vector2();
const setCursor = (x, y) => cursor.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  let dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1);
  dy = THREE.MathUtils.clamp(dy, -150, 150);
  const speed = e.ctrlKey ? 0.012 : 0.0016;           // ctrlKey = pincement sur pavé tactile
  zoomGoal = THREE.MathUtils.clamp(zoomGoal * Math.exp(-dy * speed), ZMIN, ZMAX);
  setCursor(e.clientX, e.clientY);
}, { passive: false });
let pinch = 0;
canvas.addEventListener('touchstart', (e) => { if (e.touches.length === 2) pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length !== 2 || !pinch) return;
  const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  zoomGoal = THREE.MathUtils.clamp(zoomGoal * d / pinch, ZMIN, ZMAX); pinch = d;
  setCursor((e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2);
}, { passive: true });
canvas.addEventListener('touchend', () => { pinch = 0; }, { passive: true });

const ray = new THREE.Raycaster(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), -Y0);
function groundAt(ndc) { camera.updateMatrixWorld(); ray.setFromCamera(ndc, camera); return ray.ray.intersectPlane(ground, new THREE.Vector3()); }
function shift(d) { camera.position.add(d); controls.target.add(d); }
function stepZoom(dt) {
  if (Math.abs(camera.zoom - zoomGoal) < 1e-4) return;
  const before = groundAt(cursor);
  camera.zoom += (zoomGoal - camera.zoom) * (1 - Math.exp(-dt * 12));
  camera.updateProjectionMatrix();
  const after = groundAt(cursor);
  if (before && after) { const d = before.sub(after); d.y = 0; shift(d); }  // zoom vers le pointeur
}

/* ============ Déplacement au clavier (ZQSD / WASD / flèches) ============ */
const keys = new Set();
addEventListener('keydown', (e) => { if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) { keys.add(e.code); e.preventDefault(); } });
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), mv = new THREE.Vector3();
function stepKeys(dt) {
  if (!keys.size) return;
  fwd.subVectors(controls.target, camera.position); fwd.y = 0; fwd.normalize();
  right.crossVectors(fwd, camera.up).normalize();
  mv.set(0, 0, 0);
  if (keys.has('KeyW') || keys.has('ArrowUp')) mv.add(fwd);
  if (keys.has('KeyS') || keys.has('ArrowDown')) mv.sub(fwd);
  if (keys.has('KeyD') || keys.has('ArrowRight')) mv.add(right);
  if (keys.has('KeyA') || keys.has('ArrowLeft')) mv.sub(right);
  if (mv.lengthSq()) shift(mv.normalize().multiplyScalar(dt * 22 / camera.zoom));
}
// on garde toujours le centre de la vue au-dessus de l'île ou du Coffre
function clampTarget() {
  const t = controls.target, cx = THREE.MathUtils.clamp(t.x, -BX - 4, ISLET.x + 2), cz = THREE.MathUtils.clamp(t.z, -BZ - 4, BZ + 4);
  if (cx !== t.x || cz !== t.z) shift(new THREE.Vector3(cx - t.x, 0, cz - t.z));
}

/* ============ Boucle ============ */
const clock = new THREE.Clock();
const fpsEl = document.getElementById('fps');
let fpsAcc = 0, fpsN = 0;

/* Résolution adaptative, en continu : si l'image ralentit (zoom, grand écran), on baisse un peu
   la résolution ; si l'ordinateur suit sans peine pendant quelques secondes, on la remonte.  */
const PR_MAX = Math.min(devicePixelRatio, 1.5), PR_MIN = Math.min(.6, PR_MAX);
let pr = PR_MAX, refresh = 60, perfT = 0, perfN = 0, goodWindows = 0, holdUntil = 0;
function adaptResolution(dt, t) {
  if (document.hidden || dt >= .1) { perfT = 0; perfN = 0; return; }   // onglet caché ou à-coup : on ne mesure pas
  perfT += dt; perfN++;
  if (perfT < .5) return;
  const fps = perfN / perfT; perfT = 0; perfN = 0;
  refresh = Math.max(refresh, Math.min(fps, 240));   // la fréquence de l'écran = le meilleur rythme jamais atteint
  const target = Math.min(refresh, 144) * .92;
  if (fps < Math.max(55, target * .85) && pr > PR_MIN) {
    pr = Math.max(PR_MIN, pr * .82); renderer.setPixelRatio(pr); goodWindows = 0; holdUntil = t + 4;
  } else if (fps >= target && pr < PR_MAX && t > holdUntil) {
    if (++goodWindows >= 6) { pr = Math.min(PR_MAX, pr * 1.12); renderer.setPixelRatio(pr); goodWindows = 0; holdUntil = t + 2; }
  } else goodWindows = 0;
}

/* Le navigateur utilise-t-il vraiment la carte graphique ? Sans accélération matérielle,
   tout est calculé par le processeur : on baisse alors la qualité d'office et on le signale. */
const glc = renderer.getContext(), dbg = glc.getExtension('WEBGL_debug_renderer_info');
const GPU = dbg ? String(glc.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : 'inconnue';
const SOFTWARE = /swiftshader|llvmpipe|basic render|software/i.test(GPU);
fpsEl.title = 'Carte graphique utilisée : ' + GPU;
if (SOFTWARE) { renderer.shadowMap.enabled = false; pr = PR_MIN; renderer.setPixelRatio(pr); }
function frame() {
  const dt = Math.min(clock.getDelta(), .1), t = clock.elapsedTime;
  for (const a of anim) a.fn(t, dt);
  stepKeys(dt);
  controls.update();
  stepZoom(dt);
  clampTarget();
  updateFacades();
  sizeLabels();
  renderer.render(scene, camera);
  adaptResolution(dt, t);
  fpsAcc += dt; fpsN++; if (fpsAcc > .5) { fpsEl.textContent = `${Math.round(fpsN / fpsAcc)} i/s · résolution ${Math.round(pr / PR_MAX * 100)} %${SOFTWARE ? ' · ⚠ accélération matérielle désactivée' : ''}`; fpsAcc = 0; fpsN = 0; }
  requestAnimationFrame(frame);
}
frame();
</script>
